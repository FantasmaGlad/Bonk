[package]
name = "bonk-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bonk-core = { path = "../crates/bonk-core" }

# Outside the workspace: libfuzzer-sys needs nightly, the rest of the repository stays on stable.
[workspace]

[[bin]]
name = "partition_inspect"
path = "fuzz_targets/partition_inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_open"
path = "fuzz_targets/codec_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analysis"
path = "fuzz_targets/analysis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "udf_tree"
path = "fuzz_targets/udf_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wim_split"
path = "fuzz_targets/wim_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pe_signer"
path = "fuzz_targets/pe_signer.rs"
test = false
doc = false
bench = false
