# Construit l'application Android (débogage) et sa bibliothèque Rust, lance ses tests JVM, puis Android Lint sur la version publiée. Aucun secret.
name: android

# Chemins : l'application, sa bibliothèque Rust et tout ce dont elle dépend ; une PR de bonk-ui ou de bonk-ops
# peut casser l'APK sans toucher à android/.
on:
  pull_request:
    paths:
      - "android/**"
      - "design/**"
      - "crates/bonk-android/**"
      - "crates/bonk-core/**"
      - "crates/bonk-hal/**"
      - "crates/bonk-ops/**"
      - "crates/bonk-ui/**"
      - "crates/bonk-catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "design/**"
      - "crates/bonk-android/**"
      - "crates/bonk-core/**"
      - "crates/bonk-hal/**"
      - "crates/bonk-ops/**"
      - "crates/bonk-ui/**"
      - "crates/bonk-catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plateforme Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Construire
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      # Tests JVM : le protocole avec Rust relu sur les échantillons que les tests Rust maintiennent.
      - name: Tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      # Android Lint sur la version publiée : une erreur arrête la CI ; les avertissements restent au rapport.
      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease
