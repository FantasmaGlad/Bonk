name: android

# The app, its Rust library and everything it depends on: a bonk-ui or bonk-ops change can break the APK
# without touching android/.
on:
  pull_request:
    paths:
      - "android/**"
      - "design/**"
      - "crates/bonk-android/**"
      - "crates/bonk-core/**"
      - "crates/bonk-hal/**"
      - "crates/bonk-ops/**"
      - "crates/bonk-ui/**"
      - "crates/bonk-catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Gradle wrapper is a binary CI runs: its hash must be one Gradle publishes.
      - name: Wrapper Gradle
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Plateforme Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Construire
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease
