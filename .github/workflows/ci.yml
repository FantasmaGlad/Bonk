# Validation de la compilation.
# Linux x86_64 d'abord (moins long à échouer) : formatage, lint, tests, version minimale de Rust. Les autres machines
# (Linux ARM64, Windows x64 et ARM64, macOS ARM64 et Intel) ne démarrent que si ces deux jobs réussissent.
# L'image des exécuteurs Linux est figée (ubuntu-24.04, pas ubuntu-latest) : l'image change par un commit.
# Aucun job pour une PR en brouillon ; aucune exécution pour un changement qui ne touche ni le code, ni la
# chaîne Rust, ni ce fichier (le modifier relance la CI, pour le valider).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/paquets-linux.txt"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/paquets-linux.txt"
  workflow_dispatch:

# Droits minimaux : la CI ne fait que lire le dépôt.
permissions:
  contents: read

# Sur une PR, une nouvelle exécution annule la précédente : aucune minute payée pour un état dépassé.
# Sur main, une exécution en cours n'est jamais interrompue (son build release compte).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pas de compilation incrémentale : elle alourdit le cache et ne sert à rien sur une machine neuve.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  qualite:
    name: qualité (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Le canal et les composants (rustfmt, clippy) viennent de rust-toolchain.toml.
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Restaurer le cache de compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Paquets listés dans .github/paquets-linux.txt (un seul endroit, cité par PROJET.md) : l'image est figée,
      # un changement de paquet est donc un commit.
      - name: Paquets système
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' .github/paquets-linux.txt | xargs sudo apt-get install -y --no-install-recommends
      - name: Formatage
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Le code cfg(target_os) d'un autre système n'est pas compilé ci-dessus : clippy le vérifie ici, sans
      # édition de liens ni exécution, pour que le code mort ou l'import inutilisé échoue avant les runners
      # Windows et macOS, plus chers (workflow.md, « Coût »). Ne dit rien du comportement à l'exécution.
      - name: Lint croisé (Windows et macOS, compilation seulement)
        run: |
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
          cargo clippy --workspace --all-targets --locked --target x86_64-apple-darwin -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # Le build release n'est vérifié qu'après fusion : il est plus long et la PR a déjà prouvé le reste.
      - name: Build release
        if: github.event_name == 'push'
        run: cargo build --workspace --release --locked

  msrv:
    name: version minimale de Rust (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lire la version minimale déclarée
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Vérifier que la compilation passe avec cette version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          test -n "$MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check --workspace --locked

  # Le code propre à un système ou à une architecture n'est exercé que sur elle : ces jobs ne démarrent
  # qu'une fois les deux jobs Linux x86_64 verts (échec rapide, sans mobiliser les autres machines).
  portabilite:
    name: portabilité (${{ matrix.os }})
    needs: [qualite, msrv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Une machine par couple système/architecture que Bonk livre (binaires.yml) : Linux ARM64, Windows x64 et
        # ARM64, macOS ARM64 et Intel. Dépôt public : minutes gratuites.
        os: [ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Restaurer le cache de compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Paquets système
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' .github/paquets-linux.txt | xargs sudo apt-get install -y --no-install-recommends
      # Clippy est relancé ici : il analyse le code conditionné par cfg(target_os), qui n'est pas compilé sous Linux.
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release
        if: github.event_name == 'push'
        run: cargo build --workspace --release --locked
