name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/paquets-linux.txt"
      - ".github/scripts/essai-disque-virtuel.*"
  # Merged PRs were checked one by one; the weekly run checks them together, on every system.
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No incremental build: it bloats the cache and is useless on a fresh machine.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  qualite:
    name: qualité (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Restaurer le cache de compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Paquets système
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' .github/paquets-linux.txt | xargs sudo apt-get install -y --no-install-recommends
      - name: Formatage
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Without linking, ring's C is unused: `true` stands in for the compiler.
      - name: Lint croisé (Windows et macOS, compilation seulement)
        env:
          CC_x86_64_pc_windows_gnu: "true"
          AR_x86_64_pc_windows_gnu: "true"
          CC_x86_64_apple_darwin: "true"
          AR_x86_64_apple_darwin: "true"
          CC_aarch64_linux_android: "true"
          AR_aarch64_linux_android: "true"
        run: |
          rustup target add x86_64-pc-windows-gnu x86_64-apple-darwin aarch64-linux-android
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
          cargo clippy --workspace --all-targets --locked --target x86_64-apple-darwin -- -D warnings
          cargo clippy -p bonk-core -p bonk-ops -p bonk-cli -p bonk-android -p bonk-ui --all-targets --locked --target aarch64-linux-android -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # Off in published builds: checked here so it does not rot.
      - name: Banc d'écriture Android
        run: |
          cargo clippy -p bonk-android --features banc --all-targets --locked -- -D warnings
          cargo test -p bonk-android --features banc --locked
      # fuzz/ is outside the workspace: an API change in bonk-core would otherwise break it unnoticed.
      - name: Cibles de fuzz (compilation)
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      # The windowless build must not break silently, nor pull Iced in another way.
      - name: Version en ligne de commande seule
        run: |
          cargo clippy -p bonk --all-targets --no-default-features --locked -- -D warnings
          cargo test -p bonk --no-default-features --locked
          if cargo tree -p bonk --no-default-features --locked -e normal | grep -E '^[^a-z]*(iced|wgpu|winit) '; then
            echo "la version sans fenêtre embarque une bibliothèque graphique"
            exit 1
          fi
      # Weekly only: slower, and the PR already proved the rest.
      - name: Build release
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked

  msrv:
    name: version minimale de Rust (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lire la version minimale déclarée
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Vérifier que la compilation passe avec cette version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          test -n "$MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check --workspace --locked

  # A macOS minute costs ten Linux ones: a PR runs the real systems only when it touches system code. The Linux
  # job already lints Windows and macOS by cross-compiling.
  perimetre:
    name: systèmes à essayer
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      systemes: ${{ steps.choix.outputs.systemes }}
    steps:
      - name: Choisir
        id: choix
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          tous='["ubuntu-24.04-arm","windows-latest","windows-11-arm","macos-latest","macos-15-intel"]'
          if [ "$EVENT" != pull_request ]; then
            echo "systemes=$tous" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          motif='^(crates/bonk-hal/|crates/bonk-ops/|crates/bonk/|Cargo\.lock$|rust-toolchain\.toml$|\.github/scripts/essai-disque-virtuel\.|\.github/workflows/ci\.yml$)'
          if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -qE "$motif"; then
            echo 'systemes=["windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'systemes=[]' >> "$GITHUB_OUTPUT"
          fi

  portabilite:
    name: portabilité (${{ matrix.os }})
    needs: [qualite, msrv, perimetre]
    if: needs.perimetre.outputs.systemes != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.perimetre.outputs.systemes) }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Restaurer le cache de compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Paquets système
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          grep -vE '^[[:space:]]*(#|$)' .github/paquets-linux.txt | xargs sudo apt-get install -y --no-install-recommends
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Écriture sur un disque virtuel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/essai-disque-virtuel.ps1
      - name: Écriture sur un disque virtuel (macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/essai-disque-virtuel.sh
      - name: Build release
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked
