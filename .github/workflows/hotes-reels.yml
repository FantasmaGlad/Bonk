name: hotes-reels

on:
  workflow_dispatch:
    inputs:
      hote:
        description: "Étiquette du runner auto-hébergé"
        required: true
        type: choice
        options: [bonk-linux, bonk-windows, bonk-macos]

permissions:
  contents: read

jobs:
  essai:
    name: ${{ inputs.hote }}
    runs-on: [self-hosted, "${{ inputs.hote }}"]
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Tests
        run: cargo test --workspace --locked
      - name: Énumération des disques (lecture seule)
        run: cargo run --locked -p bonk -- list --all
