# Essais sur machines réelles du mainteneur (runners auto-hébergés), pour ce que les runners hébergés ne
# jouent pas : invites UAC (Windows) et `authopen` (macOS), vrais disques USB. Manuel seulement.
# Prérequis : enregistrer un runner avec l'étiquette `bonk-windows` ou `bonk-macos` ou `bonk-linux`. Sans runner,
# le job reste en attente : ne pas le lancer. Ne jamais l'exécuter sur un dépôt qui accepte des PR de forks.
# Aucune écriture sur disque : seule l'énumération en lecture seule est lancée (une écriture réelle exige
# l'accord explicite du mainteneur, sur sa clé de test).
name: hotes-reels

on:
  workflow_dispatch:
    inputs:
      hote:
        description: "Étiquette du runner auto-hébergé"
        required: true
        type: choice
        options: [bonk-linux, bonk-windows, bonk-macos]

permissions:
  contents: read

jobs:
  essai:
    name: ${{ inputs.hote }}
    runs-on: [self-hosted, "${{ inputs.hote }}"]
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Tests
        run: cargo test --workspace --locked
      - name: Énumération des disques (lecture seule)
        run: cargo run --locked -p bonk -- list --all
