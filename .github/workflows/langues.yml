# Catalogues de langues de l'interface (D-35) : mêmes clés en français et en anglais.
# Sans catalogue (`crates/bonk-gui/locales`, chantier de langues pas encore fait), le workflow le dit.
name: langues

on:
  pull_request:
    paths: ["crates/bonk-gui/**", ".github/scripts/langues.py", ".github/workflows/langues.yml"]
  push:
    branches: [main]
    paths: ["crates/bonk-gui/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cles:
    name: clés des catalogues
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comparer les langues
        run: |
          if [ -d crates/bonk-gui/locales ]; then
            python3 .github/scripts/langues.py crates/bonk-gui/locales fr
          else
            echo "Non applicable : crates/bonk-gui/locales n'existe pas encore." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
