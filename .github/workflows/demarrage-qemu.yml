name: demarrage-qemu

on:
  schedule:
    - cron: "41 5 * * 3"
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/demarrage-qemu.yml"
      - ".github/scripts/demarrage-qemu.sh"
      - ".github/scripts/demarrage-qemu.py"
      - ".github/scripts/demarrage-vault.sh"
      - ".github/scripts/demarrage-windows.py"
      - "crates/bonk-core/src/vault.rs"
      - "crates/bonk-core/src/vault_menu.cfg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  demarrer:
    name: ${{ matrix.nom }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, uefi, secureboot]
        nom: [Debian, Ubuntu, Fedora, Arch]
        # Arch's loader is unsigned: Secure Boot refuses it, as expected.
        exclude:
          - { nom: Arch, mode: secureboot }
        include:
          # The text entry talks on the serial console.
          - nom: Debian
            base: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
            motif: 'debian-[0-9.]*-amd64-netinst\.iso'
            preuve: '\[!!\]'
            chargeur_bios: isolinux
            options: --entree 1 --memoire 2048 --delai 300
          - nom: Ubuntu
            base: https://releases.ubuntu.com/26.04.1
            motif: 'ubuntu-26\.04\.1-desktop-amd64\.iso'
            preuve: 'login:'
            chargeur_bios: grub
            options: --memoire 4096 --delai 900
          - nom: Fedora
            base: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/iso
            sommes: Fedora-Server-44-1.7-x86_64-CHECKSUM
            motif: 'Fedora-Server-netinst-x86_64-44-1\.7\.iso'
            preuve: '[Aa]naconda'
            chargeur_bios: grub
            options: --ligne 2 --attente 4 --memoire 3072 --delai 300
          # Countdown menus: keys are sent early.
          - nom: Arch
            base: https://geo.mirror.pkgbuild.com/iso/latest
            sommes: sha256sums.txt
            motif: 'archlinux-x86_64\.iso'
            preuve: 'login:'
            chargeur: systemd-boot
            chargeur_bios: isolinux
            attente_bios: 8
            options: --attente 2 --delai 300
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Installer QEMU, SeaBIOS et OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      # Without KVM, software emulation would exceed the timeout on a desktop image.
      - name: Ouvrir KVM à l'exécuteur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Construire Bonk
        run: cargo build --release --locked -p bonk
      # Same site as the image: protects against a corrupt download, not a compromised site.
      - name: Trouver l'image officielle
        env:
          BASE: ${{ matrix.base }}
          MOTIF: ${{ matrix.motif }}
          SOMMES: ${{ matrix.sommes || 'SHA256SUMS' }}
        run: |
          iso=$(curl --fail --silent --show-error --location "$BASE/$SOMMES" | grep -o "$MOTIF" | head -n 1)
          test -n "$iso"
          echo "URL=$BASE/$iso" >> "$GITHUB_ENV"
          echo "SHA256_FILE=$BASE/$SOMMES" >> "$GITHUB_ENV"
      - name: Écrire et démarrer sous QEMU
        env:
          MODE: ${{ matrix.mode }}
          PREUVE: ${{ matrix.preuve }}
          OPTIONS: ${{ matrix.options }}
          CHARGEUR: ${{ matrix.chargeur || 'grub' }}
          CHARGEUR_BIOS: ${{ matrix.chargeur_bios }}
          ATTENTE_BIOS: ${{ matrix.attente_bios }}
        run: |
          read -r -a options <<< "$OPTIONS"
          # The last option given wins.
          if [ "$MODE" = bios ] && [ -n "$ATTENTE_BIOS" ]; then
            options+=(--attente "$ATTENTE_BIOS")
          fi
          .github/scripts/demarrage-qemu.sh target/release/bonk "$URL" "$MODE" "$RUNNER_TEMP/qemu" "$PREUVE" "${options[@]}"
      - name: Conserver la trace et les écrans
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demarrage-${{ matrix.nom }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/qemu/serie.log
            ${{ runner.temp }}/qemu/*.png
          retention-days: 7

  # GRUB comes from the published catalog: the vault is checked as a user gets it.
  vault:
    name: Vault, ${{ matrix.nom }} (uefi)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Debian live
            base: https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid
            motif: 'debian-live-[0-9.]*-amd64-standard\.iso'
            options: --memoire 2048 --delai 300
          - nom: Arch
            base: https://geo.mirror.pkgbuild.com/iso/latest
            sommes: sha256sums.txt
            motif: 'archlinux-x86_64\.iso'
            options: --memoire 2048 --delai 300
          # casper does not look into exFAT: the vault swaps in its own iso-scan step (newc: in the menu).
          - nom: Ubuntu
            base: https://releases.ubuntu.com/26.04.1
            motif: 'ubuntu-26\.04\.1-desktop-amd64\.iso'
            taille: 8589934592
            options: --memoire 4096 --delai 900
          - nom: Fedora live
            base: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Workstation/x86_64/iso
            sommes: Fedora-Workstation-44-1.7-x86_64-CHECKSUM
            motif: 'Fedora-Workstation-Live-44-1\.7\.x86_64\.iso'
            taille: 4294967296
            options: --memoire 4096 --delai 600
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Installer QEMU et OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Ouvrir KVM à l'exécuteur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Construire Bonk
        run: cargo build --release --locked -p bonk
      - name: Trouver l'image officielle
        env:
          BASE: ${{ matrix.base }}
          MOTIF: ${{ matrix.motif }}
          SOMMES: ${{ matrix.sommes || 'SHA256SUMS' }}
        run: |
          iso=$(curl --fail --silent --show-error --location "$BASE/$SOMMES" | grep -o "$MOTIF" | head -n 1)
          test -n "$iso"
          echo "URL=$BASE/$iso" >> "$GITHUB_ENV"
          echo "SHA256_FILE=$BASE/$SOMMES" >> "$GITHUB_ENV"
      # The kernel line is the fourth of the entry: GRUB shows its arguments first, as setparams.
      - name: Préparer le Vault, y copier l'ISO, démarrer sous QEMU
        env:
          OPTIONS: ${{ matrix.options }}
          VAULT_SIZE: ${{ matrix.taille }}
        # The runner's second disk, when mounted, holds the ISO and the vault: the system disk may be too small.
        run: |
          read -r -a options <<< "$OPTIONS"
          if mountpoint -q /mnt; then dossier=/mnt/vault; else dossier="$RUNNER_TEMP/vault"; fi
          sudo install -d -o "$USER" "$dossier"
          echo "DOSSIER=$dossier" >> "$GITHUB_ENV"
          .github/scripts/demarrage-vault.sh target/release/bonk "$URL" "$SHA256_FILE" "$dossier" 'login:' --ligne 3 "${options[@]}"
      - name: Conserver la trace et les écrans
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demarrage-vault-${{ strategy.job-index }}
          path: |
            ${{ env.DOSSIER }}/serie.log
            ${{ env.DOSSIER }}/*.png
          retention-days: 7

  windows:
    name: ${{ matrix.nom }} (bios, uefi, secureboot)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: Windows 11 LTSC 2024, image: windows-11-enterprise-ltsc-2024-x86_64 }
          - { nom: Windows 10 LTSC 2021, image: windows-10-enterprise-ltsc-2021-x86_64 }
          - { nom: Windows Server 2022, image: windows-server-2022-x86_64 }
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Installer QEMU, SeaBIOS et OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Ouvrir KVM à l'exécuteur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Construire Bonk
        run: cargo build --release --locked -p bonk
      # The runner's second disk, when mounted, holds the image and the drive: the system disk may be too small.
      - name: Écrire la clé
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if mountpoint -q /mnt; then dossier=/mnt/windows; else dossier="$RUNNER_TEMP/windows-cle"; fi
          sudo install -d -o "$USER" "$dossier"
          df -h / "$dossier"
          echo "DOSSIER=$dossier" >> "$GITHUB_ENV"
          target/release/bonk write --simulate "$dossier/cle.img" --size $((16 << 30)) --image "$IMAGE" \
            --cache-dir "$dossier/cache" --yes --progress none
          rm -rf "$dossier/cache"
      - name: Démarrer jusqu'à l'installateur
        run: |
          for mode in bios uefi secureboot; do
            python3 .github/scripts/demarrage-windows.py "$DOSSIER/cle.img" "$mode" "$RUNNER_TEMP/windows"
          done
      - name: Conserver les écrans
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demarrage-${{ matrix.image }}
          path: ${{ runner.temp }}/windows/*.ppm
          retention-days: 7
