# La clé écrite par Bonk démarre-t-elle ? Image officielle Debian écrite sur un fichier image (aucun
# périphérique réel), puis micrologiciel UEFI sous QEMU, avec et sans Secure Boot.
# Preuve limitée au chargement du chargeur d'amorçage par le micrologiciel (voir le script) ; Linux x86_64
# seulement. Reste à faire : AAVMF (aarch64), Ubuntu, Fedora, Arch, Mint, Windows.
# L'image n'est jamais hébergée ni conservée : téléchargée du site officiel, empreinte vérifiée.
name: demarrage-qemu

on:
  schedule:
    - cron: "41 5 * * 3"
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/demarrage-qemu.yml"
      - ".github/scripts/demarrage-qemu.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  demarrer:
    name: Debian (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [uefi, secureboot]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Installer QEMU et OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Construire Bonk
        run: cargo build --release --locked -p bonk
      # L'empreinte vient du même site que l'image : elle protège d'un téléchargement corrompu, pas d'un
      # site compromis (la signature GPG de SHA256SUMS n'est pas vérifiée).
      - name: Télécharger l'image officielle
        run: |
          base=https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
          curl --fail --silent --show-error --location "$base/SHA256SUMS" --output SHA256SUMS
          iso=$(grep -o 'debian-[0-9.]*-amd64-netinst\.iso' SHA256SUMS | head -n 1)
          curl --fail --silent --show-error --location "$base/$iso" --output "$iso"
          grep " $iso\$" SHA256SUMS | sha256sum --check
          echo "ISO=$iso" >> "$GITHUB_ENV"
      - name: Démarrer sous QEMU
        env:
          MODE: ${{ matrix.mode }}
        run: .github/scripts/demarrage-qemu.sh target/release/bonk "$ISO" "$MODE" "$RUNNER_TEMP/qemu"
      - name: Conserver la trace série
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serie-${{ matrix.mode }}
          path: ${{ runner.temp }}/qemu/serie.log
          retention-days: 7
