# La clé écrite par Bonk démarre-t-elle ? Image officielle téléchargée par Bonk, empreinte vérifiée, écrite sur
# un fichier image (aucun périphérique réel), puis démarrée sous QEMU en BIOS, UEFI et Secure Boot.
# Preuve : le système atteint, vu sur la console série (voir les scripts) ; Linux x86_64 seulement. Reste à
# faire : AAVMF (aarch64), Mint. Windows : jamais en CI, une ISO Windows ne se redistribue pas.
# L'image n'est jamais hébergée ni conservée : téléchargée du site officiel, empreinte vérifiée.
name: demarrage-qemu

on:
  schedule:
    - cron: "41 5 * * 3"
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/demarrage-qemu.yml"
      - ".github/scripts/demarrage-qemu.sh"
      - ".github/scripts/demarrage-qemu.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  demarrer:
    name: ${{ matrix.nom }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, uefi, secureboot]
        nom: [Debian, Ubuntu, Fedora, Arch]
        # Le chargeur d'Arch n'est pas signé : Secure Boot le refuse, comme prévu.
        exclude:
          - { nom: Arch, mode: secureboot }
        include:
          # Entrée texte de l'installateur : il parle sur la console série, son premier écran fait preuve.
          - nom: Debian
            base: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
            motif: 'debian-[0-9.]*-amd64-netinst\.iso'
            preuve: '\[!!\]'
            chargeur_bios: isolinux
            options: --entree 1 --memoire 2048 --delai 300
          - nom: Ubuntu
            base: https://releases.ubuntu.com/26.04.1
            motif: 'ubuntu-26\.04\.1-desktop-amd64\.iso'
            preuve: 'login:'
            chargeur_bios: grub
            options: --memoire 4096 --delai 900
          - nom: Fedora
            base: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/iso
            sommes: Fedora-Server-44-1.7-x86_64-CHECKSUM
            motif: 'Fedora-Server-netinst-x86_64-44-1\.7\.iso'
            preuve: '[Aa]naconda'
            chargeur_bios: grub
            options: --ligne 2 --attente 4 --memoire 3072 --delai 300
          # Menus à compte à rebours : les touches partent tôt.
          - nom: Arch
            base: https://geo.mirror.pkgbuild.com/iso/latest
            sommes: sha256sums.txt
            motif: 'archlinux-x86_64\.iso'
            preuve: 'login:'
            chargeur: systemd-boot
            chargeur_bios: isolinux
            attente_bios: 8
            options: --attente 2 --delai 300
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt
        run: rustup toolchain install
      - name: Installer QEMU, SeaBIOS et OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      # Sans KVM, l'émulation logicielle dépasserait le délai sur une image de bureau.
      - name: Ouvrir KVM à l'exécuteur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Construire Bonk
        run: cargo build --release --locked -p bonk
      # L'empreinte vient du même site que l'image : elle protège d'un téléchargement corrompu, pas d'un
      # site compromis (la signature GPG de SHA256SUMS n'est pas vérifiée).
      - name: Trouver l'image officielle
        env:
          BASE: ${{ matrix.base }}
          MOTIF: ${{ matrix.motif }}
          SOMMES: ${{ matrix.sommes || 'SHA256SUMS' }}
        run: |
          iso=$(curl --fail --silent --show-error --location "$BASE/$SOMMES" | grep -o "$MOTIF" | head -n 1)
          test -n "$iso"
          echo "URL=$BASE/$iso" >> "$GITHUB_ENV"
          echo "SHA256_FILE=$BASE/$SOMMES" >> "$GITHUB_ENV"
      - name: Écrire et démarrer sous QEMU
        env:
          MODE: ${{ matrix.mode }}
          PREUVE: ${{ matrix.preuve }}
          OPTIONS: ${{ matrix.options }}
          CHARGEUR: ${{ matrix.chargeur || 'grub' }}
          CHARGEUR_BIOS: ${{ matrix.chargeur_bios }}
          ATTENTE_BIOS: ${{ matrix.attente_bios }}
        run: |
          read -r -a options <<< "$OPTIONS"
          # La dernière option donnée l'emporte.
          if [ "$MODE" = bios ] && [ -n "$ATTENTE_BIOS" ]; then
            options+=(--attente "$ATTENTE_BIOS")
          fi
          .github/scripts/demarrage-qemu.sh target/release/bonk "$URL" "$MODE" "$RUNNER_TEMP/qemu" "$PREUVE" "${options[@]}"
      - name: Conserver la trace et les écrans
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demarrage-${{ matrix.nom }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/qemu/serie.log
            ${{ runner.temp }}/qemu/*.png
          retention-days: 7
