# Binaires de Bonk pour chaque système hôte (CDC §11), construits en continu pour que les cibles
# d'exécution soient exercées en permanence, pas seulement à la release.
#   - push sur main, lundi (dérive des images d'exécuteur), lancement manuel : construction, essai de
#     démarrage, archive, empreinte, attestation de provenance (artefact conservé 14 jours) ;
#   - tag vX.Y.Z : mêmes étapes, puis publication d'une release en BROUILLON (le mainteneur la publie).
# Signature : attestation de provenance Sigstore (vérifiable par `gh attestation verify`), sans secret ni
# certificat. La signature Authenticode (Windows) et la notarisation Apple exigent des certificats payants,
# non provisionnés (en attente, CDC §11.1).
name: binaires

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/binaires.yml"
    tags: ["v*.*.*"]
  # Une modification du workflow est validée par sa propre PR (construction sans attestation).
  pull_request:
    paths: [".github/workflows/binaires.yml"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Droits d'attestation limités à ce job ; les autres étapes ne lisent que le dépôt.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        # outil/suffixe : `zigbuild` fixe la version minimale de la glibc (2.17, CDC §11) pour que le binaire
        # tourne sur les distributions anciennes ; musl = binaire statique, destiné à la ligne de commande
        # (la fenêtre charge les bibliothèques graphiques du système, impossible en statique).
        # fumee : le binaire s'exécute sur l'exécuteur qui l'a construit.
        include:
          - { nom: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, outil: zigbuild, suffixe: ".2.17", fumee: true, glibc: true }
          - { nom: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, outil: zigbuild, suffixe: ".2.17", fumee: true, glibc: true }
          - { nom: linux-i686, os: ubuntu-24.04, target: i686-unknown-linux-gnu, outil: zigbuild, suffixe: ".2.17", fumee: false, glibc: true }
          - { nom: linux-x86_64-musl, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, outil: zigbuild, suffixe: "", fumee: true, glibc: false }
          - { nom: linux-aarch64-musl, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, outil: zigbuild, suffixe: "", fumee: true, glibc: false }
          - { nom: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, outil: build, suffixe: "", fumee: true, glibc: false, exe: ".exe" }
          - { nom: windows-aarch64, os: windows-11-arm, target: aarch64-pc-windows-msvc, outil: build, suffixe: "", fumee: true, glibc: false, exe: ".exe" }
          - { nom: windows-i686, os: windows-2025, target: i686-pc-windows-msvc, outil: build, suffixe: "", fumee: true, glibc: false, exe: ".exe" }
          - { nom: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, outil: build, suffixe: "", fumee: true, glibc: false }
          - { nom: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, outil: build, suffixe: "", fumee: true, glibc: false }
    env:
      TARGET: ${{ matrix.target }}
      NOM: ${{ matrix.nom }}
      EXE: ${{ matrix.exe }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer la chaîne Rust du dépôt et la cible
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
        shell: bash
      - name: Restaurer le cache de compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.nom }}
      # Versions identiques à celles éprouvées en local (2026-10-30).
      - name: Installer zig et cargo-zigbuild
        if: matrix.outil == 'zigbuild'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.17.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked --version 0.24.0 cargo-zigbuild
      - name: Construire
        env:
          OUTIL: ${{ matrix.outil }}
          SUFFIXE: ${{ matrix.suffixe }}
        run: cargo "$OUTIL" --release --locked -p bonk --target "$TARGET$SUFFIXE"
        shell: bash
      # Un symbole de glibc plus récent que 2.17 ferait échouer le binaire sur les distributions anciennes.
      - name: Vérifier la version minimale de la glibc
        if: matrix.glibc
        run: |
          max=$(objdump -T "target/$TARGET/release/bonk" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "glibc maximale exigée : $max"
          test "$(printf '%s\n2.17\n' "$max" | sort -V | tail -n 1)" = "2.17"
      - name: Essai de démarrage
        if: matrix.fumee
        run: |
          "target/$TARGET/release/bonk$EXE" --version
          "target/$TARGET/release/bonk$EXE" explain E2001
        shell: bash
      - name: Nom de l'archive
        id: nom
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "v$cargo_v" || { echo "le tag $REF_NAME ne correspond pas à la version $cargo_v de Cargo.toml"; exit 1; }
            v="$cargo_v"
          else
            v="$cargo_v-${SHA::8}"
          fi
          if [ -n "$EXE" ]; then ext=zip; else ext=tar.gz; fi
          echo "dossier=bonk-$v-$NOM" >> "$GITHUB_OUTPUT"
          echo "archive=bonk-$v-$NOM.$ext" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Archive
        env:
          DOSSIER: ${{ steps.nom.outputs.dossier }}
          ARCHIVE: ${{ steps.nom.outputs.archive }}
        run: |
          mkdir -p "dist/$DOSSIER"
          cp "target/$TARGET/release/bonk$EXE" LICENSE "dist/$DOSSIER/"
          if [ -n "$EXE" ]; then
            (cd dist && 7z a -tzip "$ARCHIVE" "$DOSSIER" > /dev/null)
          else
            tar -C dist -czf "dist/$ARCHIVE" "$DOSSIER"
          fi
          rm -r "dist/$DOSSIER"
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"; else shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"; fi
          cat "$ARCHIVE.sha256"
        shell: bash
      # Dépôt public seulement (les attestations sont réservées aux dépôts publics hors offre Enterprise) ;
      # jamais sur une PR.
      - name: Attestation de provenance
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.nom.outputs.archive }}
      - name: Conserver l'archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaire-${{ matrix.nom }}
          path: dist/${{ steps.nom.outputs.archive }}*
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  # Le binaire démarre-t-il sur les distributions que visent les utilisateurs ? centos:7 est le plancher réel
  # (glibc 2.17) ; Alpine exécute la version musl. Ne dit rien de la fenêtre ni de l'accès aux disques
  # (pas d'affichage ni de périphérique dans un conteneur).
  compatibilite:
    name: ${{ matrix.image }} (${{ matrix.nom }})
    needs: construire
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "centos:7", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "rockylinux:8", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "debian:11", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "debian:13", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "ubuntu:22.04", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "ubuntu:24.04", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "fedora:latest", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "archlinux:latest", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "opensuse/tumbleweed:latest", nom: linux-x86_64, os: ubuntu-24.04 }
          - { image: "alpine:3", nom: linux-x86_64-musl, os: ubuntu-24.04 }
          - { image: "debian:13", nom: linux-aarch64, os: ubuntu-24.04-arm }
          - { image: "ubuntu:24.04", nom: linux-aarch64, os: ubuntu-24.04-arm }
          - { image: "alpine:3", nom: linux-aarch64-musl, os: ubuntu-24.04-arm }
    steps:
      - name: Récupérer l'archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaire-${{ matrix.nom }}
          path: dist
      - name: Démarrer dans la distribution
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --volume "$PWD/dist:/dist:ro" "$IMAGE" sh -c \
            'mkdir /tmp/bonk && tar -xzf /dist/bonk-*.tar.gz -C /tmp/bonk && /tmp/bonk/bonk-*/bonk --version && /tmp/bonk/bonk-*/bonk explain E2001 > /dev/null'

  # Release en brouillon : la publication reste une décision du mainteneur.
  publication:
    name: release (brouillon)
    if: github.ref_type == 'tag'
    needs: construire
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Récupérer les archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaire-*
          merge-multiple: true
          path: dist
      - name: Empreintes réunies
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
        shell: bash
      - name: Créer la release en brouillon
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
