[package]
name = "bonk-gui"
description = "Bonk window (Iced)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bonk-core.workspace = true
bonk-hal.workspace = true
bonk-catalog.workspace = true
bonk-ui.workspace = true
sys-locale.workspace = true
serde_json.workspace = true
iced.workspace = true
# Enables the PNG decoder for logos in Iced, which gets it through feature unification.
image.workspace = true
rfd.workspace = true
log.workspace = true

# Already in the tree through rfd: receives bonk:// links, which macOS sends as Apple events.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSString",
] }

[dev-dependencies]
iced_test.workspace = true

[lints]
workspace = true
