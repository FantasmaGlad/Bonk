set timeout=10
insmod part_msdos
insmod part_gpt
insmod exfat
insmod iso9660
insmod loopback
insmod regexp
insmod all_video

# The vault partition of the same drive first: another vault plugged in must not win.
regexp --set=1:disk '^([^,]*),' "$root"
for part in msdos1 gpt1; do
  # probe keeps the previous value when the partition does not exist.
  unset label
  probe --set=label --label "($disk,$part)"
  if [ -z "$vault" -a "$label" = "BonkVault" ]; then set vault="$disk,$part"; fi
done
if [ -z "$vault" ]; then search --no-floppy --label BonkVault --set=vault; fi

function add_iso {
  regexp --set=1:path '^\([^)]*\)(/.*)$' "$1"
  loopback probe "$1"
  # The kernel line is split on spaces: no live system would find this ISO again.
  if regexp ' ' "$path"; then
    menuentry "Rename without spaces: $path" {
      echo "Spaces in the ISO path cannot be passed to the system being started."
      sleep 5
    }
  elif [ -f (probe)/live/vmlinuz -a -f (probe)/live/initrd.img ]; then
    menuentry "Debian live: $path" "$path" {
      loopback loop ($vault)$2
      linux (loop)/live/vmlinuz boot=live components findiso=$2
      initrd (loop)/live/initrd.img
    }
  elif [ -f (probe)/casper/vmlinuz -a -f (probe)/casper/initrd ]; then
    # casper finds the ISO by iso-scan but does not look into exFAT: GRUB swaps in Bonk's version of that step.
    menuentry "Ubuntu: $path" "$path" {
      loopback loop ($vault)$2
      linux (loop)/casper/vmlinuz iso-scan/filename=$2 ---
      initrd (loop)/casper/initrd newc:scripts/casper-premount/20iso_scan:$config_directory/casper/20iso_scan
    }
  elif [ -f (probe)/arch/boot/x86_64/vmlinuz-linux -a -f (probe)/arch/boot/x86_64/initramfs-linux.img ]; then
    # archiso_loop_mnt: the initramfs mounts the vault by its label, then the ISO from it.
    menuentry "Arch Linux: $path" "$path" {
      loopback loop ($vault)$2
      linux (loop)/arch/boot/x86_64/vmlinuz-linux archisobasedir=arch img_label=BonkVault img_loop=$2
      initrd (loop)/arch/boot/x86_64/initramfs-linux.img
    }
  elif [ -f (probe)/boot/x86_64/loader/linux -a -f (probe)/boot/x86_64/loader/initrd ]; then
    unset isolabel
    probe --set=isolabel --label (probe)
    if regexp '^Fedora-' "$isolabel"; then
      # Kiwi live image: dracut finds the ISO by iso-scan, then its root by the ISO label.
      menuentry "Fedora live: $path" "$path" "$isolabel" {
        loopback loop ($vault)$2
        linux (loop)/boot/x86_64/loader/linux iso-scan/filename=$2 root=live:CDLABEL=$3 rd.live.image
        initrd (loop)/boot/x86_64/loader/initrd
      }
    else
      menuentry "Not supported by this vault: $path" {
        echo "This ISO is not in the vault's compatibility list."
        sleep 5
      }
    fi
  else
    menuentry "Not supported by this vault: $path" {
      echo "This ISO is not in the vault's compatibility list."
      sleep 5
    }
  fi
  loopback -d probe
}

if [ -z "$vault" ]; then
  menuentry "No BonkVault partition found" {
    sleep 5
  }
else
  for iso in ($vault)/*.iso ($vault)/*/*.iso ($vault)/*.ISO ($vault)/*/*.ISO; do
    if [ -f "$iso" ]; then add_iso "$iso"; fi
  done
fi
