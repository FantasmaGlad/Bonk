set timeout=10
insmod part_msdos
insmod part_gpt
insmod exfat
insmod iso9660
insmod loopback
insmod regexp
insmod all_video

# GRUB restores config_directory once this file is read: entries run after, so keep it now.
set bonk_dir="$config_directory"

# The vault partition of the same drive first: another vault plugged in must not win.
regexp --set=1:disk '^([^,]*),' "$root"
for part in msdos1 gpt1; do
  # probe keeps the previous value when the partition does not exist.
  unset label
  probe --set=label --label "($disk,$part)"
  if [ -z "$vault" -a "$label" = "BonkVault" ]; then set vault="$disk,$part"; fi
done
if [ -z "$vault" ]; then search --no-floppy --label BonkVault --set=vault; fi

# Sets `family` (empty when not supported) and `iso_cpu` for the ISO mounted as (probe).
function detect {
  unset family
  if [ -f (probe)/live/vmlinuz -a -f (probe)/live/initrd.img ]; then
    set family=debian
  elif [ -f (probe)/casper/vmlinuz -a -f (probe)/casper/initrd ]; then
    set family=ubuntu
  elif [ -f (probe)/arch/boot/x86_64/vmlinuz-linux -a -f (probe)/arch/boot/x86_64/initramfs-linux.img ]; then
    set family=arch
  elif [ -f (probe)/boot/x86_64/loader/linux -a -f (probe)/boot/x86_64/loader/initrd ]; then
    set family=fedora
  elif [ -f (probe)/boot/aarch64/loader/linux -a -f (probe)/boot/aarch64/loader/initrd ]; then
    set family=fedora
  fi
  if [ "$family" = fedora ]; then
    unset isolabel
    probe --set=isolabel --label (probe)
    # Other Kiwi images share this layout.
    if regexp '^Fedora-' "$isolabel"; then set family=fedora; else unset family; fi
  fi
  # A Kiwi kernel folder names its processor; Debian and Ubuntu keep one layout, their UEFI loader tells.
  if [ -f (probe)/boot/aarch64/loader/linux ]; then
    set iso_cpu=arm64
  elif [ -f (probe)/boot/x86_64/loader/linux ]; then
    set iso_cpu=x86_64
  elif [ -f (probe)/EFI/boot/bootaa64.efi ]; then
    set iso_cpu=arm64
  else
    set iso_cpu=x86_64
  fi
}

# The entry of an ISO this machine can start, or the reason it cannot.
function add_entry {
  # The kernel line is split on spaces: no live system would find this ISO again.
  if regexp ' ' "$path"; then
    menuentry "Rename without spaces: $path" {
      echo "Spaces in the ISO path cannot be passed to the system being started."
      sleep 5
    }
  elif [ "$family" = debian ]; then
    menuentry "Debian live: $path" "$path" {
      loopback loop ($vault)$2
      linux (loop)/live/vmlinuz boot=live components findiso=$2
      initrd (loop)/live/initrd.img
    }
  elif [ "$family" = ubuntu ]; then
    # casper cannot read exFAT: Bonk's iso-scan step maps the ISO from the partition at the offset `bonk vault
    # add` wrote next to it.
    if [ -f "$1.bonk" ]; then
      menuentry "Ubuntu: $path" "$path" "$1.bonk" {
        source "$3"
        loopback loop ($vault)$2
        linux (loop)/casper/vmlinuz bonk.offset=$bonk_offset ---
        initrd (loop)/casper/initrd newc:scripts/casper-premount/20iso_scan:$bonk_dir/casper/20iso_scan
      }
    else
      menuentry "Ubuntu, add it with bonk vault add: $path" {
        echo "Ubuntu starts from the vault only when added by bonk vault add, which records where it lies."
        sleep 5
      }
    fi
  elif [ "$family" = arch ]; then
    # archiso_loop_mnt: the initramfs mounts the vault by its label, then the ISO from it.
    menuentry "Arch Linux: $path" "$path" {
      loopback loop ($vault)$2
      linux (loop)/arch/boot/x86_64/vmlinuz-linux archisobasedir=arch img_label=BonkVault img_loop=$2
      initrd (loop)/arch/boot/x86_64/initramfs-linux.img
    }
  elif [ "$family" = fedora ]; then
    set kernel_cpu=x86_64
    if [ "$iso_cpu" = arm64 ]; then set kernel_cpu=aarch64; fi
    # Kiwi live image: dracut finds the ISO by iso-scan, then its root by the ISO label.
    menuentry "Fedora live: $path" "$path" "$isolabel" "$kernel_cpu" {
      loopback loop ($vault)$2
      linux (loop)/boot/$4/loader/linux iso-scan/filename=$2 root=live:CDLABEL=$3 rd.live.image
      initrd (loop)/boot/$4/loader/initrd
    }
  else
    menuentry "Not supported by this vault: $path" {
      echo "This ISO is not in the vault's compatibility list."
      sleep 5
    }
  fi
}

# $2: `here` adds what this machine starts, and what it cannot read; `other` lists, after, the ISO of other
# processors.
function add_iso {
  regexp --set=1:path '^\([^)]*\)(/.*)$' "$1"
  loopback probe "$1"
  detect
  if [ -n "$family" -a "$iso_cpu" != "$grub_cpu" ]; then
    if [ "$2" = other ]; then
      menuentry "For $iso_cpu machines: $path" {
        echo "This ISO starts on another processor than this machine's."
        sleep 5
      }
    fi
  elif [ "$2" = here ]; then
    add_entry "$1"
  fi
  loopback -d probe
}

if [ -z "$vault" ]; then
  menuentry "No BonkVault partition found" {
    sleep 5
  }
else
  # This machine's ISO first: the first entry starts on its own after the timeout.
  for pass in here other; do
    for iso in ($vault)/*.iso ($vault)/*/*.iso ($vault)/*.ISO ($vault)/*/*.ISO; do
      if [ -f "$iso" ]; then add_iso "$iso" "$pass"; fi
    done
  done
fi
