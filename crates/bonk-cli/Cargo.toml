[package]
name = "bonk-cli"
description = "Bonk command line: arguments, text and JSON output, stable exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bonk-core.workspace = true
bonk-hal.workspace = true
bonk-ops.workspace = true
bonk-catalog.workspace = true
clap.workspace = true
serde.workspace = true
schemars.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
log.workspace = true

[dev-dependencies]
# Man pages for the packages, written by a test: nothing in the shipped binary.
clap_mangen = "0.3"
bonk-core = { workspace = true, features = ["testing"] }
# Signs test catalogs; already a dependency of bonk-catalog.
ring = "0.17"

[lints]
workspace = true
