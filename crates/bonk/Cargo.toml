[package]
name = "bonk"
description = "Point d'entrée unique de Bonk : interface graphique ou ligne de commande."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bonk-core.workspace = true
bonk-hal.workspace = true
bonk-cli.workspace = true
bonk-gui.workspace = true

[dev-dependencies]
bonk-core = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true

# Paquets Linux (workflow `paquets`) : le binaire est autonome, les bibliothèques graphiques sont chargées
# à l'exécution quand elles existent.
[package.metadata.deb]
maintainer = "FantasmaGlad <193235053+FantasmaGlad@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "libc6"
# Écriture sans sudo : UDisks2 ouvre le disque, polkit demande l'autorisation. `policykit-1` est l'ancien
# nom du paquet de polkit.
recommends = "udisks2, polkitd | policykit-1"
extended-description = "Création de supports d'amorçage (clés USB et disques externes), interface graphique et ligne de commande."
assets = [
    ["target/release/bonk", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/bonk/copyright", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/bonk", dest = "/usr/bin/bonk", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bonk/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
udisks2 = ""
polkit = ""
