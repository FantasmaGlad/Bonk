[package]
name = "bonk"
description = "Single entry point of Bonk: window or command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bonk-core.workspace = true
bonk-hal.workspace = true
bonk-cli.workspace = true
bonk-gui = { workspace = true, optional = true }

[features]
default = ["gui"]
# The window. Without it: command-line-only binary, `cargo build -p bonk --no-default-features`.
gui = ["dep:bonk-gui"]

[[test]]
name = "parity"
required-features = ["gui"]

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
bonk-core = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true

# Linux packages (`paquets` workflow): the binary is self-contained, graphics libraries are loaded at run
# time when present.
[package.metadata.deb]
maintainer = "FantasmaGlad <193235053+FantasmaGlad@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "libc6"
# Writing without sudo: UDisks2 opens the disk, polkit asks for authorization. `policykit-1` is polkit's
# old package name.
recommends = "udisks2, polkitd | policykit-1"
extended-description = "Bootable media writer for USB drives and external disks, with a window and a command line."
assets = [
    ["target/release/bonk", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/bonk/copyright", "644"],
    ["assets/bonk.desktop", "usr/share/applications/", "644"],
    ["assets/icons/16x16/bonk.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["assets/icons/24x24/bonk.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["assets/icons/32x32/bonk.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["assets/icons/48x48/bonk.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["assets/icons/64x64/bonk.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["assets/icons/128x128/bonk.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["assets/icons/256x256/bonk.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/icons/512x512/bonk.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/bonk", dest = "/usr/bin/bonk", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/bonk/LICENSE", mode = "644", doc = true },
    { source = "assets/bonk.desktop", dest = "/usr/share/applications/bonk.desktop", mode = "644" },
    { source = "assets/icons/16x16/bonk.png", dest = "/usr/share/icons/hicolor/16x16/apps/bonk.png", mode = "644" },
    { source = "assets/icons/24x24/bonk.png", dest = "/usr/share/icons/hicolor/24x24/apps/bonk.png", mode = "644" },
    { source = "assets/icons/32x32/bonk.png", dest = "/usr/share/icons/hicolor/32x32/apps/bonk.png", mode = "644" },
    { source = "assets/icons/48x48/bonk.png", dest = "/usr/share/icons/hicolor/48x48/apps/bonk.png", mode = "644" },
    { source = "assets/icons/64x64/bonk.png", dest = "/usr/share/icons/hicolor/64x64/apps/bonk.png", mode = "644" },
    { source = "assets/icons/128x128/bonk.png", dest = "/usr/share/icons/hicolor/128x128/apps/bonk.png", mode = "644" },
    { source = "assets/icons/256x256/bonk.png", dest = "/usr/share/icons/hicolor/256x256/apps/bonk.png", mode = "644" },
    { source = "assets/icons/512x512/bonk.png", dest = "/usr/share/icons/hicolor/512x512/apps/bonk.png", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
udisks2 = ""
polkit = ""
