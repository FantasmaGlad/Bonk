# Built targets only: a target added to the workflows is added here.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[advisories]
# Each exception has its reason and removal criterion; review at each Iced upgrade.
# osv-scanner.toml repeats these exceptions for Scorecard, which also scans wasm32-only crates.
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru unsound in LruCache::pop when a key's Drop panics; cryoglyph 0.1.0 (Iced 0.14) requires lru 0.16 (fixed in 0.18.2) and only calls pop_lru with a Copy key, so no Drop. Remove when cryoglyph pulls lru 0.18.2 or later" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; pulled by metal through wgpu-hal (Iced 0.14). Remove when Iced or wgpu no longer pulls paste" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; pulled by Iced 0.14's text stack. Remove when Iced or cosmic-text no longer pulls ttf-parser" },
]
# Scorecard also sees "unsound" advisories of transitive dependencies.
unsound = "all"
# An exception no longer needed must be removed, not linger silently.
unused-ignored-advisory = "deny"

[licenses]
# MPL-2.0 only requires sharing its own modified files: compatible with MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Boost licence, permissive: required by clipboard-win and error-code (Iced's Windows dependencies).
    "BSL-1.0",
]
# The list also covers future cases: do not report unused entries.
unused-allowed-license = "allow"

# Pulled only for wasm32; limited to this crate so the licence is not allowed elsewhere.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Workspace crates (publish = false) carry the project licence: not checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version: allowed for private crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
