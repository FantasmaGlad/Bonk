
# Cibles construites seulement : une cible ajoutée aux workflows s'ajoute ici.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[advisories]
# Chaque exception porte sa raison et son critère de retrait ; à relire à chaque montée d'Iced.
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru unsound dans LruCache::pop si le Drop d'une clé panique ; cryoglyph 0.1.0 (Iced 0.14) exige lru 0.16, corrigé en 0.18.2, et n'appelle que pop_lru avec une clé Copy, donc sans Drop. Retrait : une version de cryoglyph qui tire lru 0.18.2 ou plus" },
    { id = "RUSTSEC-2024-0436", reason = "paste non maintenu ; dépendance de metal, via wgpu-hal (Iced 0.14). Retrait : une version d'Iced ou de wgpu qui ne tire plus paste" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser non maintenu ; dépendance de la pile de texte d'Iced 0.14. Retrait : une version d'Iced ou de cosmic-text qui ne tire plus ttf-parser" },
]
# Scorecard voit aussi les avis « unsound » des dépendances transitives.
unsound = "all"
# Une exception devenue inutile doit être retirée, pas rester en silence.
unused-ignored-advisory = "deny"

[licenses]
# MPL-2.0 n'exige le partage que de ses propres fichiers modifiés : compatible avec MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Licence Boost, permissive : requise par clipboard-win et error-code (dépendances Windows d'Iced).
    "BSL-1.0",
]
# La liste couvre aussi des cas futurs : ne pas signaler les entrées pas encore utilisées.
unused-allowed-license = "allow"

# Tiré seulement pour wasm32 ; limité à ce crate pour ne pas admettre cette licence ailleurs.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Les crates du workspace (publish = false) portent la licence du projet : non contrôlées.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les dépendances par chemin entre crates du workspace n'ont pas de version : autorisé pour les crates privées.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
