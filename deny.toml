
# Built targets only: a target added to the workflows is added here.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "x86_64-linux-android",
]

[advisories]
# Each exception has its reason and removal criterion; review at each Iced upgrade.
# osv-scanner.toml repeats these exceptions for Scorecard, which also scans wasm32-only crates.
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "lru unsound dans LruCache::pop si le Drop d'une clé panique ; cryoglyph 0.1.0 (Iced 0.14) exige lru 0.16, corrigé en 0.18.2, et n'appelle que pop_lru avec une clé Copy, donc sans Drop. Retrait : une version de cryoglyph qui tire lru 0.18.2 ou plus" },
    { id = "RUSTSEC-2024-0436", reason = "paste non maintenu ; dépendance de metal, via wgpu-hal (Iced 0.14). Retrait : une version d'Iced ou de wgpu qui ne tire plus paste" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser non maintenu ; dépendance de la pile de texte d'Iced 0.14. Retrait : une version d'Iced ou de cosmic-text qui ne tire plus ttf-parser" },
]
# Scorecard also sees "unsound" advisories of transitive dependencies.
unsound = "all"
# An exception no longer needed must be removed, not linger silently.
unused-ignored-advisory = "deny"

[licenses]
# MPL-2.0 only requires sharing its own modified files: compatible with MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Boost licence, permissive: required by clipboard-win and error-code (Iced's Windows dependencies).
    "BSL-1.0",
]
# The list also covers future cases: do not report unused entries.
unused-allowed-license = "allow"

# Pulled only for wasm32; limited to this crate so the licence is not allowed elsewhere.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Workspace crates (publish = false) carry the project licence: not checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version: allowed for private crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
