# Read by iced_test only, never by the application: UI tests render with tiny-skia whatever the graphics
# driver; a value already set in the environment wins.
[env]
ICED_TEST_BACKEND = "tiny-skia"

# A clean Windows has no VCRUNTIME140.dll: the C runtime is linked into the executable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
